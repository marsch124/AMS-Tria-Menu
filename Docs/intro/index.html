<style>
/* Layout: chapter rail on the left, coach + a pretend Mac on the right. Reusable tour engine: LESSONS + a small simulator.

   Every pretend-screen class starts with tm- so it can never clash with the engine's own classes. */
:root {
  --bg: #F3F6FA; --panel: #FFFFFF; --fg: #17212B; --muted: #5F6C7A; --line: #DCE3EB;

  --c-mac: #1C7347; --c-macf: #217E4F; --c-fan: #1F69C2; --c-fanf: #00875A; --c-heat: #B8421C; --c-heatf: #C44D24;
  --c-warn: #8F5900; --c-danger: #C71A24; --c-power: #07707A; --c-story: #6B4DBC; --c-storyf: #6B4DBC;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", sans-serif;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}

  --accent:#4FD39A; --accent-soft:#16332A; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --desk-a:#1C2733; --desk-b:#2E2A3A; --menubar: rgba(28,28,32,.8); --menubar-fg:#F2F2F4;
  --win:#27272B; --win-bar:#323237; --win-fg:#F2F2F4; --win-muted:#A5A5AD; --card: rgba(255,255,255,.07); --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-mac:#66C78F; --c-macf:#298554; --c-fan:#80BAFA; --c-fanf:#2B75CC; --c-heat:#F79470; --c-heatf:#C44D24;
  --c-warn:#F5C25C; --c-danger:#FF6B6B; --c-power:#5CCCCC; --c-story:#B8A3F5; --c-storyf:#755CC7;
  color-scheme: dark } }
:root[data-theme="dark"] {

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 66ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #00875A; border-color: #00875A; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend Mac */
.stagebox { position: relative; width: 100%; aspect-ratio: 960 / 560; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 100% }
.stage { position: absolute; left: 0; top: 0; width: 960px; height: 560px; transform-origin: 0 0; font-family: var(--f-mac); font-size: 12.5px; color: var(--win-fg);
  background: radial-gradient(120% 90% at 15% 10%, var(--desk-b), transparent 60%), linear-gradient(160deg, var(--desk-a), var(--desk-b)); }
.stage button { font-family: inherit }

}

  --t-green:#00C97B; --t-blue:#3B9EFF; --t-purple:#C084FC; --t-purplef:#9A5CF0; --t-pink:#E35A9D; --t-plum:#45082A; --t-pale:.22;
  --i-swim:#4F87F8; --i-bike:#FFD60A; --i-run:#85CE6C; --i-strength:#FF8C1A; --i-rest:#A3B1C2; --i-rowing:#0D9488; --i-mobility:#8650FE; --i-race:#EF4444; --pilltx:rgba(0,0,0,.85); --miss:#A5A5AD; } }

  --t-green:#00C97B; --t-blue:#3B9EFF; --t-purple:#C084FC; --t-purplef:#9A5CF0; --t-pink:#E35A9D; --t-plum:#45082A; --t-pale:.22;
  --i-swim:#4F87F8; --i-bike:#FFD60A; --i-run:#85CE6C; --i-strength:#FF8C1A; --i-rest:#A3B1C2; --i-rowing:#0D9488; --i-mobility:#8650FE; --i-race:#EF4444; --pilltx:rgba(0,0,0,.85); --miss:#A5A5AD; }

.tm-sp { flex: 1 }
.tm-mbar { position: absolute; inset: 0 0 auto; height: 26px; background: var(--menubar); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 16px; padding: 0 12px; color: var(--menubar-fg); font-size: 13px; z-index: 30 }

.tm-miss { color: var(--win-muted); font-size: 11px; font-weight: 600 }
.tm-hint { font-size: 10px; color: var(--win-muted); padding-left: 2px }
.tm-quiet { font-size: 12.5px; color: var(--win-muted); background: rgba(127,127,127,.12); border-radius: 9px; padding: 8px; line-height: 1.35 }
.tm-line { font-size: 12.5px; font-variant-numeric: tabular-nums }
.tm-weekbar { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--t-purple) calc(var(--t-pale) * 100%), transparent); margin-top: 2px; overflow: hidden }
.tm-weekbar i { display: block; height: 100%; border-radius: 3px; background: var(--t-purplef) }
.tm-card { background: var(--t-pink); color: #fff; border-radius: 11px; padding: 6px 10px 7px; margin-top: 3px }
.tm-ctop { display: flex; align-items: baseline; gap: 7px }

.tm-bnum { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1 }
.tm-small { font-size: 10px; font-weight: 600; white-space: nowrap }
.tm-card svg { display: block; width: 100%; height: 74px }
.tm-main { border: 0; border-radius: 9px; height: 28px; background: #00875A; color: #fff; font: 600 12.5px var(--f-mac); cursor: pointer; width: 100% }

.tm-sign > i s { display: block; text-decoration: none; width: 28px; height: 14px; border-radius: 5px }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tm-toast { color: #10200F } }

.target { z-index: 2; animation: fmring 1.6s ease-in-out infinite; border-radius: 7px }
@keyframes fmring { 0%,100% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 6px rgba(230,181,63,.35) } 50% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 11px rgba(230,181,63,0) } }
@keyframes fmpop { from { transform: translateY(8px); opacity: .3 } to { transform: none; opacity: 1 } }

/* Finish */
.finish { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0,1fr) }

function curveSVG() {
  const W = 276, H = 74, foot = 14, base = H - foot;
  const P = ([x, y]) => [3 + x * (W - 6), base - y * (base - 5)];
  const line = pts => pts.map((p, i) => (i ? 'L' : 'M') + P(p).map(v => v.toFixed(1)).join(' ')).join('');
  const today = S.src === 'board' || S.src === 'triathlon' ? BODY_TODAY : [], yest = S.src === 'none' ? [] : BODY_YEST;
  if (!today.length && !yest.length) return '';
  let g = '';
  if (today.length > 1) { const a = P(today[0]), z = P(today[today.length - 1]); g += `<path d="${line(today)}L${z[0].toFixed(1)} ${base}L${a[0].toFixed(1)} ${base}Z" fill="rgba(255,255,255,.28)"/>`; }
  if (yest.length > 1) { g += `<path d="${line(yest)}" fill="none" stroke="var(--t-plum)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`;
    const sp = P(yest.find(p => p[0] >= .8) || yest[yest.length - 1]); g += `<text x="${Math.min(Math.max(sp[0], 24), W - 24)}" y="${Math.max(sp[1] - 9, 8)}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--t-plum)">yesterday</text>`; }
  if (today.length > 1) { g += `<path d="${line(today)}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`; const z = P(today[today.length - 1]); g += `<circle cx="${z[0].toFixed(1)}" cy="${z[1].toFixed(1)}" r="3.3" fill="#fff"/>`; }
  [6, 12, 18].forEach(h => { const x = 3 + h / 24 * (W - 6); g += `<path d="M${x} ${base}v3" stroke="rgba(255,255,255,.75)" stroke-width="1"/><text x="${x}" y="${H - 2}" text-anchor="middle" font-size="8.5" font-weight="500" fill="#fff">${String(h).padStart(2, '0')}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" data-t="curve">${g}</svg>`;
}

function openMenu() { set({ panel: false, menu: !S.menu }); renderStage(); if (S.menu) emit('menu-open'); }

const stage = document.getElementById('stage');
stage.addEventListener('contextmenu', ev => { if (ev.target.closest('.tm-item')) { ev.preventDefault(); openMenu(); } });
stage.addEventListener('mouseover', ev => { if (ev.target.closest('.tm-item')) emit('hover'); });

/* Clicks inside the pretend Mac */
stage.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) {
    if (S.panel && !ev.target.closest('.tm-panel, .tm-practice')) { S.panel = false; renderStage(); emit('panel-close'); }
    else if (S.menu && !ev.target.closest('.tm-ctx, .tm-practice')) { S.menu = false; renderStage(); }
    return; }
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'item': if (ev.ctrlKey) { openMenu(); break; }
      set({ menu: false, panel: !S.panel }); if (S.panel) set({ settings: false }); renderStage(); emit(S.panel ? 'panel-open' : 'panel-close'); break;
    case 'gear': set({ panel: false, settings: true, spage: 'settings' }); renderStage(); emit('settings'); break;
    case 'row': set({ panel: false }); renderStage(); toast('Triathlon opens that session (practice copy)'); emit('row', id); break;
    case 'open-tri': set({ panel: false }); renderStage(); toast('Triathlon comes to the front (practice copy)'); emit('open-tri'); break;
    case 'm-open': set({ menu: false }); renderStage(); toast('Triathlon comes to the front (practice copy)'); emit('open-tri'); break;
    case 'm-refresh': set({ menu: false }); renderStage(); toast('Reading the note and asking the Board again'); emit('refresh'); break;
    case 'm-settings': set({ menu: false, settings: true, spage: 'settings' }); renderStage(); emit('settings'); break;
    case 'spage': S.spage = el.dataset.p; renderStage(); emit('tab', S.spage); break;
    case 'close-settings': S.settings = false; renderStage(); emit('settings-close'); break;
    case 'sw': { const k = el.dataset.k; S[k] = !S[k]; renderStage(); emit('sw', { k, on: S[k] }); break; }
    case 'refresh':
      if (S.busy) break;
      S.busy = true; renderStage(); emit('refresh'); later(() => { S.busy = false; renderStage(); }, 1500); break;
    case 'p-rclick': openMenu(); break;
    case 'p-write': S.note = true; renderStage(); emit('note-written'); break;
    case 'p-log': S.sessions = S.sessions.map(s => s.key === 'run' ? { ...s, state: 'done' } : s); S.week = '1 h 25 min done of 3 h 35 min planned'; S.weekShare = 85 / 215; renderStage(); emit('logged'); break;
    case 'p-noboard': S.src = 'triathlon'; renderStage(); emit('src', 'triathlon'); break;
    case 'p-nosync': S.src = 'waiting'; renderStage(); emit('src', 'waiting'); break;
    default: break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (S.settings) { S.settings = false; renderStage(); emit('settings-close'); }
  else if (S.menu) { S.menu = false; renderStage(); }
  else if (S.panel) { S.panel = false; renderStage(); emit('panel-close'); }
});

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('triamenu-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); return; }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '✓ ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to click is out of sight (a window or the panel was closed), point at the way back to it.
  const el = q(curTarget) || (S.settings ? q('done') : S.panel ? q('gear') : q('item'));
  if (el) {
    el.classList.add('target');
    const pane = el.closest('.tm-pane');
    if (pane && pane !== el) { let top = 0, n = el; while (n && n !== pane) { top += n.offsetTop; n = n.offsetParent; } const bot = top + el.offsetHeight; if (top < pane.scrollTop || bot > pane.scrollTop + pane.clientHeight) pane.scrollTop = Math.max(0, top - 40); }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand">${tile(40)}<div><h1>Tria Menu Tour</h1><small>Learn the app in about 8 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '✓' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('trophy')}<span>On your Mac</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Everything here is a practice copy. Nothing changes on your Mac.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();   // bring the pretend Mac to where that chapter starts
  renderStep();
}

function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">· ${kindName} · step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('triamenu-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Rest the pointer on the wave in your menu bar and read the words: the sessions, and Body Battery.',
    'Click the wave and read the panel from top to bottom: Today, Tomorrow, This week, and the pink Body Battery card.',
    'Click a session row and see it open in AMS Triathlon Training. Come back with the wave.',
    'Right-click (or control-click) the wave and look for “Open Triathlon”, “Refresh now” and “Settings…”.',
    'Open Settings with the gear. Look at “Open at login” and “Open Triathlon quietly” and decide which you want.',
    'Press “Refresh now” and read the two lines under “Where the figures come from”.',
    'Read “How it works”, down to “Signs in this app”, and look at “What’s new”.',
    'Tomorrow morning: is the wave green without you opening Triathlon? Then the quiet opening works.'];
  let ticks = JSON.parse(store.get('triamenu-real') || '[]');
  fin.innerHTML = `<h3>Now try it on your real Mac</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('triamenu-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 960×560 pretend Mac into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 960})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'INPUT') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); } });
goChapter(0); fit();
</script>
